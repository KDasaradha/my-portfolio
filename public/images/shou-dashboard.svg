<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="url(#bg-gradient)" rx="12"/>
  
  <!-- Main Card -->
  <rect x="15" y="15" width="370" height="170" 
        fill="url(#card-gradient)" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="1" 
        rx="10" 
        filter="url(#shadow)"/>
  
  <!-- Dashboard Icon -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="60" height="40" fill="rgba(255,255,255,0.2)" rx="4"/>
    <rect x="5" y="5" width="15" height="15" fill="#60a5fa" rx="2"/>
    <rect x="25" y="5" width="30" height="8" fill="rgba(255,255,255,0.4)" rx="2"/>
    <rect x="25" y="15" width="20" height="5" fill="rgba(255,255,255,0.3)" rx="1"/>
    <rect x="5" y="25" width="50" height="10" fill="rgba(255,255,255,0.3)" rx="2"/>
    
    <!-- Chart Icon -->
    <g transform="translate(65, 0)">
      <rect x="0" y="0" width="40" height="40" fill="rgba(255,255,255,0.1)" rx="4"/>
      <rect x="5" y="25" width="4" height="10" fill="#34d399"/>
      <rect x="12" y="20" width="4" height="15" fill="#60a5fa"/>
      <rect x="19" y="15" width="4" height="20" fill="#f59e0b"/>
      <rect x="26" y="18" width="4" height="17" fill="#ef4444"/>
      <rect x="33" y="22" width="4" height="13" fill="#8b5cf6"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="200" y="90" text-anchor="middle" fill="#ffffff" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="24" font-weight="700" letter-spacing="-0.025em">
    SHOU Dashboard
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="115" text-anchor="middle" fill="#e0e7ff" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="14" font-weight="500">
    HRMS &amp; Animation Pipeline Management
  </text>
  
  <!-- Tech Stack -->
  <text x="200" y="135" text-anchor="middle" fill="#bfdbfe" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="12" font-weight="400">
    Microservices Architecture
  </text>
  
  <!-- Technologies -->
  <g transform="translate(120, 145)">
    <!-- FastAPI -->
    <rect x="0" y="0" width="50" height="20" fill="rgba(16,185,129,0.2)" 
          stroke="rgba(16,185,129,0.5)" stroke-width="1" rx="10"/>
    <text x="25" y="14" text-anchor="middle" fill="#10b981" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="10" font-weight="600">FastAPI</text>
    
    <!-- Docker -->
    <rect x="60" y="0" width="45" height="20" fill="rgba(59,130,246,0.2)" 
          stroke="rgba(59,130,246,0.5)" stroke-width="1" rx="10"/>
    <text x="82.5" y="14" text-anchor="middle" fill="#3b82f6" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="10" font-weight="600">Docker</text>
    
    <!-- Jenkins -->
    <rect x="115" y="0" width="50" height="20" fill="rgba(245,158,11,0.2)" 
          stroke="rgba(245,158,11,0.5)" stroke-width="1" rx="10"/>
    <text x="140" y="14" text-anchor="middle" fill="#f59e0b" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="10" font-weight="600">Jenkins</text>
  </g>
  
  <!-- Enterprise Badge -->
  <g transform="translate(320, 25)">
    <rect x="0" y="0" width="65" height="24" fill="rgba(239,68,68,0.2)" 
          stroke="rgba(239,68,68,0.5)" stroke-width="1" rx="12"/>
    <circle cx="12" cy="12" r="4" fill="#ef4444"/>
    <text x="35" y="16" text-anchor="middle" fill="#ef4444" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="10" font-weight="600">Enterprise</text>
  </g>
</svg>