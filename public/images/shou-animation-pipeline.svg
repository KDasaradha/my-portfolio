<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="pipeline-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pipeline-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="url(#pipeline-bg)" rx="12"/>
  
  <!-- Main Card -->
  <rect x="15" y="15" width="370" height="170" 
        fill="url(#pipeline-card)" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="1" 
        rx="10"/>
  
  <!-- Pipeline Flow Visualization -->
  <g transform="translate(30, 30)">
    <!-- Stage 1 - Pre-production -->
    <g>
      <circle cx="20" cy="20" r="12" fill="rgba(34,197,94,0.3)" stroke="#22c55e" stroke-width="2"/>
      <text x="20" y="25" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="8" font-weight="600">PRE</text>
      <rect x="8" y="35" width="24" height="8" fill="rgba(34,197,94,0.2)" rx="2"/>
      <text x="20" y="41" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="6">Concept</text>
    </g>
    
    <!-- Arrow 1 -->
    <path d="M 35 20 L 55 20" stroke="rgba(255,255,255,0.6)" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Stage 2 - Production -->
    <g transform="translate(40, 0)">
      <circle cx="20" cy="20" r="12" fill="rgba(59,130,246,0.3)" stroke="#3b82f6" stroke-width="2"/>
      <text x="20" y="25" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="8" font-weight="600">PROD</text>
      <rect x="8" y="35" width="24" height="8" fill="rgba(59,130,246,0.2)" rx="2"/>
      <text x="20" y="41" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="6">Animation</text>
    </g>
    
    <!-- Arrow 2 -->
    <path d="M 75 20 L 95 20" stroke="rgba(255,255,255,0.6)" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Stage 3 - Post-production -->
    <g transform="translate(80, 0)">
      <circle cx="20" cy="20" r="12" fill="rgba(168,85,247,0.3)" stroke="#a855f7" stroke-width="2"/>
      <text x="20" y="25" text-anchor="middle" fill="#a855f7" font-family="system-ui" font-size="8" font-weight="600">POST</text>
      <rect x="8" y="35" width="24" height="8" fill="rgba(168,85,247,0.2)" rx="2"/>
      <text x="20" y="41" text-anchor="middle" fill="#a855f7" font-family="system-ui" font-size="6">Render</text>
    </g>
    
    <!-- Arrow 3 -->
    <path d="M 115 20 L 135 20" stroke="rgba(255,255,255,0.6)" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Stage 4 - Delivery -->
    <g transform="translate(120, 0)">
      <circle cx="20" cy="20" r="12" fill="rgba(239,68,68,0.3)" stroke="#ef4444" stroke-width="2"/>
      <text x="20" y="25" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="8" font-weight="600">SHIP</text>
      <rect x="8" y="35" width="24" height="8" fill="rgba(239,68,68,0.2)" rx="2"/>
      <text x="20" y="41" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="6">Delivery</text>
    </g>
  </g>
  
  <!-- Progress Indicators -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="300" height="6" fill="rgba(255,255,255,0.1)" rx="3"/>
    <rect x="0" y="0" width="210" height="6" fill="url(#progress-gradient)" rx="3"/>
    <text x="150" y="20" text-anchor="middle" fill="rgba(255,255,255,0.8)" 
          font-family="system-ui" font-size="10">70% Complete</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="rgba(255,255,255,0.6)" />
    </marker>
    <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="200" y="120" text-anchor="middle" fill="#ffffff" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="24" font-weight="700" letter-spacing="-0.025em">
    Animation Pipeline
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="140" text-anchor="middle" fill="#fed7aa" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="14" font-weight="500">
    Production Tracking &amp; Project Management
  </text>
  
  <!-- Features -->
  <g transform="translate(80, 155)">
    <!-- Task Tracking -->
    <rect x="0" y="0" width="70" height="18" fill="rgba(34,197,94,0.2)" 
          stroke="rgba(34,197,94,0.5)" stroke-width="1" rx="9"/>
    <text x="35" y="12" text-anchor="middle" fill="#22c55e" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="9" font-weight="600">Task Tracking</text>
    
    <!-- Resource Mgmt -->
    <rect x="80" y="0" width="80" height="18" fill="rgba(59,130,246,0.2)" 
          stroke="rgba(59,130,246,0.5)" stroke-width="1" rx="9"/>
    <text x="120" y="12" text-anchor="middle" fill="#3b82f6" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="9" font-weight="600">Resource Mgmt</text>
    
    <!-- Timeline -->
    <rect x="170" y="0" width="55" height="18" fill="rgba(168,85,247,0.2)" 
          stroke="rgba(168,85,247,0.5)" stroke-width="1" rx="9"/>
    <text x="197.5" y="12" text-anchor="middle" fill="#a855f7" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="9" font-weight="600">Timeline</text>
  </g>
  
  <!-- Cinema Badge -->
  <g transform="translate(320, 25)">
    <rect x="0" y="0" width="60" height="24" fill="rgba(245,158,11,0.2)" 
          stroke="rgba(245,158,11,0.5)" stroke-width="1" rx="12"/>
    <circle cx="12" cy="12" r="4" fill="#f59e0b"/>
    <text x="32" y="16" text-anchor="middle" fill="#f59e0b" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="10" font-weight="600">Cinema</text>
  </g>
</svg>